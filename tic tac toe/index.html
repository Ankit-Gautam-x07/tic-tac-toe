<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta
        name="description"
        content="Modern responsive Tic Tac Toe game built with HTML, CSS and JavaScript."
    >

    <title>Tic Tac Toe | Akki</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="game-wrapper">

        <section class="game-card">

            <!-- Header -->
            <header class="game-header">

                <p class="eyebrow">
                    JAVASCRIPT MINI PROJECT
                </p>

                <h1>
                    Tic <span>Tac</span> Toe
                </h1>

                <p class="subtitle">
                    Classic two-player game with a modern interface.
                </p>

            </header>


            <!-- Scoreboard -->
            <section class="scoreboard">

                <div class="score-box player-x">

                    <span class="player-label">
                        PLAYER X
                    </span>

                    <strong id="scoreX">
                        0
                    </strong>

                </div>


                <div class="turn-indicator">

                    <span class="turn-dot"></span>

                    <span id="turnText">
                        X's Turn
                    </span>

                </div>


                <div class="score-box player-o">

                    <span class="player-label">
                        PLAYER O
                    </span>

                    <strong id="scoreO">
                        0
                    </strong>

                </div>

            </section>


            <!-- Game Board -->
            <section
                class="game-board"
                id="gameBoard"
                aria-label="Tic Tac Toe board"
            >

                <button
                    class="cell"
                    data-index="0"
                    aria-label="Cell 1"
                ></button>

                <button
                    class="cell"
                    data-index="1"
                    aria-label="Cell 2"
                ></button>

                <button
                    class="cell"
                    data-index="2"
                    aria-label="Cell 3"
                ></button>

                <button
                    class="cell"
                    data-index="3"
                    aria-label="Cell 4"
                ></button>

                <button
                    class="cell"
                    data-index="4"
                    aria-label="Cell 5"
                ></button>

                <button
                    class="cell"
                    data-index="5"
                    aria-label="Cell 6"
                ></button>

                <button
                    class="cell"
                    data-index="6"
                    aria-label="Cell 7"
                ></button>

                <button
                    class="cell"
                    data-index="7"
                    aria-label="Cell 8"
                ></button>

                <button
                    class="cell"
                    data-index="8"
                    aria-label="Cell 9"
                ></button>

            </section>


            <!-- Result -->
            <p
                class="result-message"
                id="resultMessage"
                aria-live="polite"
            >
                Make your move!
            </p>


            <!-- Buttons -->
            <div class="game-actions">

                <button
                    class="btn btn-primary"
                    id="newRoundBtn"
                    type="button"
                >
                    ↻ New Round
                </button>

                <button
                    class="btn btn-secondary"
                    id="resetScoreBtn"
                    type="button"
                >
                    Reset Score
                </button>

            </div>


            <div class="mode-selector">
    <button id="playerModeBtn" class="mode-btn active">
        👥 2 Players
    </button>

    <button id="computerModeBtn" class="mode-btn">
        🤖 Computer
    </button>
</div>


            <!-- Footer -->
            <footer class="game-footer">

                <span>
                    Built with
                    <strong>HTML</strong>,
                    <strong>CSS</strong> &
                    <strong>JavaScript</strong>
                </span>

            </footer>

        </section>

    </main>


    <script src="script.js"></script>

</body>
</html>
